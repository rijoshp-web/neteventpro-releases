name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Unit tests
        run: npm test
      - name: Build installer (signed when the NEP_SIGN_PFX and NEP_SIGN_PASSWORD secrets exist)
        shell: pwsh
        env:
          NEP_SIGN_PFX: ${{ secrets.NEP_SIGN_PFX }}
          NEP_SIGN_PASSWORD: ${{ secrets.NEP_SIGN_PASSWORD }}
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NetEventPro-Setup
          path: dist/NetEventPro-Setup-*.exe
