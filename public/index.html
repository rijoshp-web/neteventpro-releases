<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetEventPro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101722'/%3E%3Cpath d='M6 9h20M6 16h14M6 23h9' stroke='%2345c2a5' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Main">
    <div class="brand"><span class="mark"></span><span class="lbl">NetEventPro</span><button id="railToggle" class="ghost icon-btn" aria-label="Collapse side panel" aria-expanded="true" title="Collapse side panel">&laquo;</button></div>
    <a href="#dashboard" data-view="dashboard" title="Dashboard"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span class="lbl">Dashboard</span></a>
    <a href="#logs" data-view="logs" title="Logs"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><span class="lbl">Logs</span><span class="badge" id="navLiveCount"></span></a>
    <a href="#traps" data-view="traps" title="SNMP traps"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg></span><span class="lbl">Traps</span><span class="badge" id="navTrapCount"></span></a>
    <a href="#alarms" data-view="alarms" title="Alarms"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/><path d="M12 8v4"/><path d="M12 14.5v.5"/></svg></span><span class="lbl">Alarms</span><span class="badge bad" id="navAlarms"></span></a>
    <a href="#devices" data-view="devices" title="Devices"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></span><span class="lbl">Devices</span><span class="badge warn" id="navSilent"></span></a>
    <a href="#health" data-view="health" title="System health: CPU, memory, disk, network and checks"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></span><span class="lbl">System health</span><span class="badge" id="navHealth"></span></a>
    <a data-perm="polling" href="#polling" data-view="polling" title="SNMP polling: CPU, memory, temperature and interface traffic of your devices"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg></span><span class="lbl">SNMP polling</span></a>
    <a data-perm="rules" href="#rules" data-view="rules" title="Rules &amp; alerts"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></span><span class="lbl">Rules &amp; alerts</span></a>
    <a data-perm="settings" href="#notifications" data-view="notifications" title="Notifications: e-mail, SMS, webhooks and who is told"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg></span><span class="lbl">Notifications</span></a>
    <a data-perm="settings" href="#sqlcopy" data-view="sqlcopy" title="SQL Server: keep a copy of the data in a Microsoft SQL Server database"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></span><span class="lbl">SQL Server</span></a>
    <a href="#reports" data-view="reports" title="Scheduled reports" data-perm="reports"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg></span><span class="lbl">Reports</span></a>
    <a href="#maintenance" data-view="maintenance" title="Maintenance windows" data-perm="rules"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0-5.2 5.2L3.5 17.5a2 2 0 0 0 3 3l5.8-5.8a4 4 0 0 0 5.2-5.2L14.5 12 12 9.5z"/></svg></span><span class="lbl">Maintenance</span></a>
    <a href="#settings" data-view="settings" title="Settings"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span><span class="lbl">Settings</span></a>
    <a href="#users" data-view="users" title="Users, roles and groups" data-perm="users"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3 3 0 0 1 0 5.5M18 14.3c1.7.8 3 2.6 3 5.7"/></svg></span><span class="lbl">Users</span></a>
    <a href="#backup" data-view="backup" title="Backup and restore" data-perm="backup"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></span><span class="lbl">Backup</span></a>
    <a href="#help" data-view="help" title="User guide"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.6M12 17h.01"/></svg></span><span class="lbl">Help</span></a>
    <div class="rail-foot">
      <button id="fsBtn" class="ghost" title="Show the dashboard full screen (press Esc to leave)" aria-pressed="false"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span><span class="lbl">Full screen</span></button>
      <div class="ver" id="meText"></div><button class="ver linkbtn" id="signOut" hidden>Sign out</button><div class="ver" id="verText"></div>
    </div>
  </nav>
  <div class="main">
    <header class="status"><div class="status-items" id="statusBar" aria-live="polite"></div><div class="clock" id="clock" role="timer" aria-label="Current date and time"></div></header>
    <div class="banner" id="banner" hidden></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Message details"></aside>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
<script src="dashboard.js"></script>
<script src="health.js"></script>
<script src="admin.js"></script>
<script src="alarms.js"></script>
<script src="notify.js"></script>
<script src="sqlcopy.js"></script>
<script src="security.js"></script>
<script src="snmp.js"></script>
<script src="polling.js"></script>
<script src="guide.js"></script>
</body>
</html>
