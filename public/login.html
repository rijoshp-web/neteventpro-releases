<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · NetEventPro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101722'/%3E%3Cpath d='M6 9h20M6 16h14M6 23h9' stroke='%2345c2a5' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body class="loginpage">
<aside class="login-side" aria-hidden="true">
  <div class="brand"><span class="mark"></span><span class="lbl">NetEventPro</span></div>
  <div class="login-pitch">
    <h2>Every device message, in one place.</h2>
    <p>Syslog, SNMP traps and polling, with alarms that say what needs you first.</p>
  </div>
  <div class="sevribbon"><i style="--w:92%;background:var(--s0)"></i><i style="--w:78%;background:var(--s1)"></i><i style="--w:64%;background:var(--s2)"></i><i style="--w:86%;background:var(--s3)"></i><i style="--w:50%;background:var(--s4)"></i><i style="--w:70%;background:var(--s5)"></i><i style="--w:58%;background:var(--s6)"></i></div>
</aside>
<main class="login-card">
  <div class="brand login-brand"><span class="mark"></span><span class="lbl">NetEventPro</span></div>
  <h1>Sign in</h1>
  <form id="f" autocomplete="off">
    <label for="u">User name</label>
    <input id="u" name="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Password</label>
    <div class="pwrow"><input id="p" name="password" type="password" autocomplete="new-password" readonly required><button type="button" id="pw" class="pwtoggle" aria-label="Show password" aria-pressed="false">Show</button></div>
    <div id="caps" class="login-caps" hidden>Caps Lock is on.</div>
    <div id="codeRow" hidden>
      <label for="c">Authenticator code</label>
      <input id="c" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" spellcheck="false" placeholder="6 digits, or a recovery code">
      <p class="muted login-note" style="margin:4px 0 0">Open your authenticator app and type the current code.</p>
    </div>
    <div id="err" class="login-err" role="alert" aria-live="polite"></div>
    <button type="submit" class="primary" id="go">Sign in</button>
  </form>
  <p class="muted login-note">Built-in administrator user name: <b>admin</b></p>
  <p class="muted login-note" style="margin-top:18px">© NetEventPro. All rights reserved.</p>
</main>
<script src="/login.js"></script>
</body>
</html>
